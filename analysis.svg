 <title>Shopping Conversion</title>
 <desc>1,908 of 12,330 sessions end in purchase (15.5%). Prioritise high-volume segments for qualitative investigation, and use interval width to recognise small-group uncertainty. Traffic categories are anonymised: do not relabel them as Google, email or paid search. Observed associations are not channel effectiveness or causal effects. No sequential event log: this is segment conversion, not a checkout-stage funnel. PageValues is not used; multiple segment comparisons are exploratory and unadjusted.</desc>
